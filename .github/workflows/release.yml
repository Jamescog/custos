name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.0.0"
      draft:
        description: "Create as draft release"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            artifact-name: linux-amd64-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev build-essential xvfb

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build App
        run: |
          xvfb-run --auto-servernum wails build -platform ${{ matrix.platform }} -tags webkit2gtk_4_1 -ldflags "-X main.version=${{ github.ref_name || inputs.version }}"

      - name: Package Linux (DEB)
        run: ./scripts/package-deb.sh
        env:
          VERSION: ${{ github.ref_name || inputs.version }}
          SKIP_BUILD: 1
          ARCH: amd64

      - name: Package Linux (TarGz)
        run: ./scripts/package-targz.sh
        env:
          VERSION: ${{ github.ref_name || inputs.version }}
          SKIP_BUILD: 1
          ARCH: amd64

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            build/bin/*
            dist/*/*
          if-no-files-found: error

  create-release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Inspect
        run: ls -la dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.version }}
          name: ${{ github.ref_name || inputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          generate_release_notes: true
          files: dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
