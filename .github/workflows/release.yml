name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev build-essential xvfb

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build App
        run: |
          xvfb-run --auto-servernum wails build -platform ${{ matrix.platform }} -ldflags "-X main.version=${{ github.ref_name }}"

      - name: Package Linux (DEB)
        if: matrix.os == 'ubuntu-latest'
        run: ./scripts/package-deb.sh
        env:
          VERSION: ${{ github.ref_name }}

      - name: Package Linux (TarGz)
        if: matrix.os == 'ubuntu-latest'
        run: ./scripts/package-targz.sh
        env:
          VERSION: ${{ github.ref_name }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: |
            build/bin/*
            dist/*/*

  create-release:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
